<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>__FONTS__</style>
<style>
  :root{--teal:#144556;--clay:#CF764E;--lav:#A57DB7;--sand:#F3ECDF;--paper:#FBF7F0;--deep:#0E3340;--ink:#173A45}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--deep);color:var(--sand);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden}
  .wrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);height:__HEIGHT__px}
  .stage{position:relative}
  svg#tree{width:100%;height:100%;display:block}
  .panel{padding:28px 30px;display:flex;flex-direction:column;gap:18px;border-left:1px solid rgba(243,236,223,.12);overflow:auto}
  .legend{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid rgba(243,236,223,.25);background:transparent;color:var(--sand);cursor:pointer;font-family:inherit}
  .chip[aria-pressed="true"]{background:var(--sand);color:var(--deep);border-color:var(--sand)}
  .chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:0}
  .card{background:rgba(243,236,223,.06);border-radius:18px;padding:22px 22px 20px;min-height:220px;display:flex;flex-direction:column;gap:12px}
  .meta{font-size:13px;color:rgba(243,236,223,.7);display:flex;align-items:center;gap:8px}
  .meta .dot{width:10px;height:10px;border-radius:50%}
  .q{font-family:"Playfair Display",Georgia,serif;font-size:clamp(20px,2.2vw,27px);line-height:1.3;margin:0}
  .who{font-size:14px;color:rgba(243,236,223,.75);margin:0}
  .play{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;margin-top:auto;background:var(--clay);color:#fff;border:0;border-radius:999px;padding:11px 18px 11px 14px;font:500 15px "DM Sans",sans-serif;cursor:pointer}
  .play:focus-visible,.chip:focus-visible,.node:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
  .play svg{width:18px;height:18px}
  .note{font-size:12.5px;line-height:1.5;color:rgba(243,236,223,.6);margin:0}
  .hint{position:absolute;left:24px;bottom:18px;font-size:13px;color:rgba(243,236,223,.65)}
  .node{cursor:pointer}
  .node circle.halo{opacity:0;transition:opacity .25s}
  .node:hover circle.halo,.node.active circle.halo{opacity:.35}
  .node.dim{opacity:.18}
  .branch.dim{opacity:.12}
  @media (max-width:760px){.wrap{grid-template-columns:1fr;grid-template-rows:56% 44%}.panel{border-left:0;border-top:1px solid rgba(243,236,223,.12);padding:18px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="tree" viewBox="0 -10 900 650" role="group" aria-label="Árbol de Preguntas Heredadas. Cada punto es una pregunta; actívalo para escucharla."></svg>
    <div class="hint">Toca un punto para escuchar la pregunta</div>
  </div>
  <div class="panel">
    <div class="legend" id="legend" role="toolbar" aria-label="Filtrar por orilla"></div>
    <div class="card" id="card" aria-live="polite">
      <div class="meta"><span class="dot" id="cdot"></span><span id="cmeta"></span></div>
      <p class="q" id="cq"></p>
      <p class="who" id="cwho"></p>
      <button class="play" id="play" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span id="playlbl">Escuchar la pregunta</span>
      </button>
    </div>
    <p class="note">Prototipo funcional. En la temporada piloto, cada punto reproducirá el fragmento de audio exacto donde la invitada formula su pregunta. Mientras tanto, se escucha con voz sintética.</p>
  </div>
</div>
<script>
const DATA = __DATA__;
const ORILLAS = DATA.orillas;           // [{id,name,color}]
const QS = DATA.preguntas;              // [{orilla, texto, autora, tipo, ep}]
const svg = document.getElementById('tree');
const NS = "http://www.w3.org/2000/svg";
const el = (n, a={}, p=svg) => { const e=document.createElementNS(NS,n); for (const k in a) e.setAttribute(k,a[k]); p.appendChild(e); return e; };

// ground / river
el('path',{d:'M0 600 C 200 570 330 610 450 600 C 600 588 720 612 900 596 L900 640 L0 640Z',fill:'#144556'});
el('path',{d:'M0 618 C 220 600 340 628 450 618 C 610 606 730 628 900 614',stroke:'#F3ECDF','stroke-opacity':.35,'stroke-width':2,fill:'none'});

// trunk + roots
el('path',{d:'M450 604 C 420 610 390 616 352 612 M450 604 C 486 612 520 616 560 610',stroke:'#F3ECDF','stroke-opacity':.5,'stroke-width':5,'stroke-linecap':'round',fill:'none'});
const trunk = el('path',{d:'M450 606 C 440 540 462 470 450 400',stroke:'#F3ECDF','stroke-width':16,'stroke-linecap':'round',fill:'none'});

const n = ORILLAS.length;
const T0 = {x:450,y:400};
const branchEls = {}, nodeEls = [];
ORILLAS.forEach((o,i)=>{
  const t = n===1?0.5:i/(n-1);
  const ang = (-172 + t*164) * Math.PI/180;
  const ex = T0.x + Math.cos(ang)*395, ey = T0.y + Math.sin(ang)*330 + (Math.abs(t-.5)<.01?0:-20);
  // control point: rise first, then lean out; bend the middle branch
  const cx = T0.x + Math.cos(ang)*120 + (Math.abs(t-.5)<.15? -60:0), cy = T0.y - 170 - Math.sin(Math.PI*t)*40;
  const g = el('g',{class:'branch','data-o':o.id});
  const p = el('path',{d:`M${T0.x} ${T0.y} Q ${cx} ${cy} ${ex} ${ey}`,stroke:o.color,'stroke-width':8,'stroke-linecap':'round',fill:'none'},g);
  branchEls[o.id] = {g,p,ex,ey,cx,cy};
  // decorative leaves
  for(let k=0;k<6;k++){
    const tt=.25+k*.13; const a=qpoint(branchEls[o.id],tt), b2=qpoint(branchEls[o.id],tt+.01);
    const deg=Math.atan2(b2.y-a.y,b2.x-a.x)*180/Math.PI + (k%2?55:-55);
    el('path',{d:'M0 0 C 6 -8 18 -9 26 0 C 18 9 6 8 0 0Z',fill:o.color,opacity:.38,transform:`translate(${a.x} ${a.y}) rotate(${deg})`},g);
  }
});
function qpoint(b,t){
  const x=(1-t)*(1-t)*T0.x+2*(1-t)*t*b.cx+t*t*b.ex, y=(1-t)*(1-t)*T0.y+2*(1-t)*t*b.cy+t*t*b.ey; return {x,y};
}
const byO = {};
QS.forEach((q,idx)=>{ (byO[q.orilla] ||= []).push({...q,idx}); });
ORILLAS.forEach(o=>{
  const list = byO[o.id]||[]; const b = branchEls[o.id];
  // central question always at the tip
  list.sort((a,c)=>(a.tipo==='central')-(c.tipo==='central'));
  const others=list.filter(q=>q.tipo!=='central');
  list.forEach(q=>{
    let base, nx, ny;
    if(q.tipo==='central'){ base={x:b.ex,y:b.ey}; nx=b.ex; ny=b.ey; }
    else{
      const k=others.indexOf(q), m=others.length;
      const t = 0.32 + 0.58*((k+0.5)/Math.max(m,1));
      base=qpoint(b,t); const nb=qpoint(b,t+.01);
      const ang=Math.atan2(nb.y-base.y,nb.x-base.x)+(k%2?1:-1)*Math.PI/2;
      const L = q.tipo==='visitante'? 30+ (k%3)*9 : 26;
      nx=base.x+Math.cos(ang)*L; ny=base.y+Math.sin(ang)*L;
      el('path',{d:`M${base.x} ${base.y} L ${nx} ${ny}`,stroke:o.color,'stroke-width':3,'stroke-linecap':'round'},b.g);
    }
    const g = el('g',{class:'node',tabindex:0,role:'button','aria-label':`${o.name}: ${q.texto}`,'data-o':o.id});
    const r = q.tipo==='central'?17:(q.tipo==='visitante'?8:12);
    el('circle',{class:'halo',cx:nx,cy:ny,r:r+10,fill:o.color},g);
    el('circle',{cx:nx,cy:ny,r:r,fill:q.tipo==='visitante'?'#F3ECDF':o.color,stroke:q.tipo==='visitante'?o.color:'#F3ECDF','stroke-width':q.tipo==='visitante'?3:2.5},g);
    if(q.tipo==='central'){ const tx=el('text',{x:nx,y:ny+5,'text-anchor':'middle',fill:'#0E3340','font-family':'Playfair Display, serif','font-size':15,'font-weight':600},g); tx.textContent=o.ep; }
    g.addEventListener('click',()=>select(q,g));
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();select(q,g);} });
    g.dataset.idx=q.idx; nodeEls.push(g);
  });
  const lab = el('text',{x:b.ex,y:b.ey-30,'text-anchor':'middle',fill:'#F3ECDF','font-family':'DM Sans, sans-serif','font-size':16,'font-weight':500},b.g);
  lab.textContent = o.name;
});

// growth animation (single orchestrated moment)
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(!reduce){
  [trunk, ...Object.values(branchEls).map(b=>b.p)].forEach((p,i)=>{
    const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
    p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:1100,delay:i===0?0:500+i*120,fill:'forwards',easing:'cubic-bezier(.3,.6,.2,1)'});
  });
  nodeEls.forEach((g,i)=>{ g.style.opacity=0; g.animate([{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(1)'}],{duration:500,delay:1300+i*45,fill:'forwards'}); g.style.transformOrigin='center'; g.style.transformBox='fill-box'; });
}

// legend / filter
const legend = document.getElementById('legend'); let filter=null;
const all = document.createElement('button'); all.className='chip'; all.textContent='Todas'; all.setAttribute('aria-pressed','true'); legend.appendChild(all);
all.onclick=()=>setFilter(null);
ORILLAS.forEach(o=>{ const c=document.createElement('button'); c.className='chip'; c.setAttribute('aria-pressed','false'); c.dataset.o=o.id;
  c.innerHTML=`<i style="background:${o.color}"></i>`; c.appendChild(document.createTextNode(o.name)); c.onclick=()=>setFilter(o.id); legend.appendChild(c); });
function setFilter(id){ filter=id;
  legend.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', String((c.dataset.o||null)===id)));
  document.querySelectorAll('.branch').forEach(b=>b.classList.toggle('dim', !!id && b.dataset.o!==id));
  nodeEls.forEach(g=>g.classList.toggle('dim', !!id && g.dataset.o!==id));
}

// card + voice
const card={dot:cdot,meta:cmeta,q:cq,who:cwho}; let current=null;
function select(q,g){
  current=q; nodeEls.forEach(n=>n.classList.remove('active')); if(g) g.classList.add('active');
  const o=ORILLAS.find(x=>x.id===q.orilla);
  card.dot.style.background=o.color;
  card.meta.textContent = `${o.name}${q.ep?'  ·  Episodio '+q.ep:''}`;
  card.q.textContent = q.texto;
  card.who.textContent = q.autora;
  speechSynthesis.cancel(); if(audio) audio.pause(); playlbl.textContent='Escuchar la pregunta';
}
function pickVoice(){ const v=speechSynthesis.getVoices(); return v.find(x=>/es[-_](EC|CO|MX|US|419)/i.test(x.lang)) || v.find(x=>/^es/i.test(x.lang)); }
let audio=null;
play.onclick=()=>{
  if(!current) return;
  if(current.audio){                       // fragmento real del episodio
    if(audio && !audio.paused){ audio.pause(); playlbl.textContent='Escuchar la pregunta'; return; }
    audio=new Audio(current.audio); audio.onended=()=>playlbl.textContent='Escuchar la pregunta';
    audio.play(); playlbl.textContent='Detener'; return;
  }
  if(speechSynthesis.speaking){ speechSynthesis.cancel(); playlbl.textContent='Escuchar la pregunta'; return; }
  const u=new SpeechSynthesisUtterance(current.texto); const v=pickVoice(); if(v) u.voice=v; u.lang=v?v.lang:'es-ES'; u.rate=.92; u.pitch=1.05;
  u.onend=()=>playlbl.textContent='Escuchar la pregunta';
  playlbl.textContent='Detener'; speechSynthesis.speak(u);
};
// initial selection
const first = QS.findIndex(q=>q.tipo==='heredada');
select(QS[first<0?0:first], nodeEls.find(g=>+g.dataset.idx===(first<0?0:first)));
</script>
</body>
</html>
