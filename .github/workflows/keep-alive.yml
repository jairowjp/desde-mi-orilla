name: Mantener activa la app (Streamlit)

on:
  schedule:
    - cron: "17 */4 * * *"   # cada 4 horas (UTC); el umbral de hibernación es 12 h
  workflow_dispatch:          # permite ejecutarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Visitar y despertar la app
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
        run: python scripts/wake.py
